# WirePlumber inside the add-on only has to connect Soloist's stream to the
# tunnel to Home Assistant's audio server. There is no hardware, D-Bus or
# user session in the container, and nothing needs to be remembered between
# restarts (Soloist manages its own volume).

# Same as the defaults, minus libpipewire-module-rt: it can only ask for
# realtime priority over D-Bus, and logs errors when that isn't there.
override.context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
]

wireplumber.profiles = {
  main-embedded = {
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    support.dbus = disabled
  }
}
