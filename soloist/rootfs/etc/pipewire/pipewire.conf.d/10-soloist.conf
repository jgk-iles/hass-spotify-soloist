# PipeWire inside the add-on: a single output that forwards ("tunnels") all
# audio to Home Assistant's audio server, so Soloist can use its native
# PipeWire output instead of its PulseAudio fallback.

context.properties = {
  # Spotify streams (including lossless) are 44.1 kHz; run the graph at that
  # rate so audio is not resampled inside the add-on.
  default.clock.rate = 44100
  default.clock.allowed-rates = [ 44100 48000 88200 96000 ]

  # There is no D-Bus (or rtkit) in the add-on container
  support.dbus = false
  module.rt = false
}

context.modules = [
  {
    name = libpipewire-module-pulse-tunnel
    args = {
      tunnel.mode = sink
      # No pulse.server.address: libpulse finds Home Assistant's audio
      # server through the client.conf the Supervisor mounts (or PULSE_SERVER).
      pulse.latency = 200
      # Reconnect when Home Assistant's audio server restarts
      reconnect.interval.ms = 5000
      audio.format = F32
      audio.rate = 44100
      audio.channels = 2
      audio.position = [ FL FR ]
      # The stream's name as Home Assistant's audio server shows it
      media.name = "Spotify Soloist"
      stream.props = {
        node.name = "home_assistant"
        node.description = "Home Assistant audio"
      }
    }
  }
]
